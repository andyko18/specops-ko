name: llm-smoke
on:
  schedule:
    - cron: '0 0 * * 1'   # 매주 월요일 00:00 UTC
  workflow_dispatch: {}
permissions:
  issues: write
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: secret 확인 (부재 시 graceful skip)
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret 미등록 — smoke skip (gh secret set ANTHROPIC_API_KEY 로 활성화)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: claude CLI 설치
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: smoke eval (6 fixtures, ~$3)
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          bash scripts/tests/llm-eval/run-evals.sh scripts/tests/llm-eval/fixtures-smoke.jsonl 2>&1 | tee /tmp/smoke-out.txt
      - name: 실패 시 issue 통보 (FAIL 요약 포함 — FR-3)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="[llm-smoke] weekly failure"
          if [ -s /tmp/smoke-out.txt ]; then
            SUMMARY=$(grep -E '^FAIL |^PASS=' /tmp/smoke-out.txt | tail -10)
          fi
          SUMMARY="${SUMMARY:-출력 캡처 없음}"
          # issue 본문은 GitHub secret 마스킹 미적용 — CLI stderr 유래 key 조각 방어 (Phase C 권고)
          SUMMARY=$(printf '%s' "$SUMMARY" | sed -E 's/sk-ant-[A-Za-z0-9_-]+/[REDACTED]/g')
          BODY="주간 LLM smoke 실패 — run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAIL 요약:
          \`\`\`
          ${SUMMARY}
          \`\`\`"
          EXISTING=$(gh issue list --state open --search "in:title $TITLE" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi

  # mutation score 회귀 게이트 (20260714-mutation-ci-gate) — secret 불요라 항상 실행.
  #   run-all 은 2분41초 부담으로 mutation 미포함(수동). 주간 cron 으로 강제화해
  #   governance-lib 커버리지가 baseline(55%) 밑으로 떨어지면 감지한다.
  #
  # 20261008: 대상별 matrix 로 분할. 종전엔 전 대상을 job 1개(timeout 20분)에 직렬로 돌려 6주 연속
  #   `cancelled` 였다 — 대상 합계가 20분을 넘고(check-screen-quality 단독 1064~1368s), 취소는 아무도 모른 채
  #   게이트가 6주간 꺼져 있었다. 이제 대상 1건 = job 1개이고, 각 timeout 은 mutation-targets.conf 주석의
  #   실측 소요의 2배 이상(최소 20분)이다. 소요는 **스위트 1회 소요 x 실행 사이트 수**로 는다(실패한 스위트도 끝까지 돈다) —
  #   대상 스위트에 테스트를 많이 더했으면 여기 timeout 도 다시 잰다(20261010: #167 이 스위트를 키워 두 대상이 한도를 넘게 됐다). 실패·취소는 아래 mutation-notify job 이 issue 로 알린다.
  #   ※ 새 대상을 mutation-targets.conf 에 추가하면 여기 matrix 에도 추가한다(누락 시 그 대상은 CI 에서 측정되지 않는다).
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false   # 한 대상이 미달이어도 나머지 대상 결과를 끝까지 본다
      matrix:
        include:
          - name: parse-dag
            target: scripts/dag/parse-dag.sh
            timeout: 20       # 사이트 8건 x 스위트 ~2s — 수 분 미만
          - name: governance-lib
            target: hooks/governance-lib.sh
            timeout: 360      # 20261010 로컬 실측: 스위트 6종 1회 92s x 실행 사이트 155 = 최악 약 238분. hosted 상한(360)에 가깝다 — 넘으면 사이트를 나눠 돌려야 한다
          - name: pretool-governance
            target: hooks/pretool-governance.sh
            timeout: 90       # 20261010 로컬 실측: 스위트 1회 81s x 실행 사이트 30 = 최악 약 40분 (종전 205s 는 test-pretool 이 커지기 전 값)
          - name: run-bounded
            target: scripts/_internal/run-bounded.sh
            timeout: 20       # 실측 17s
          - name: verification-state
            target: scripts/_internal/verification-state.sh
            timeout: 60       # 20261010 로컬 실측: 스위트 1회 118s x 실행 사이트 15 = 최악 약 30분 (종전 364s 는 S20 추가 전 값)
          - name: check-screen-quality
            target: scripts/_internal/check-screen-quality.sh
            timeout: 50       # 실측 1064~1368s (2배 = 46분) · 20261010: 스위트 1회 32s x 실행 사이트 45 = 최악 약 24분
    name: mutation (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - name: mutation score gate (${{ matrix.name }}, baseline 55%)
        env:
          MUTATION_MIN_SCORE: 55
        run: bash scripts/tests/mutation-score.sh --target "${{ matrix.target }}"

  # mutation matrix 실패·취소 통보. 별도 job 인 이유: timeout 으로 취소된 job 안의 후속 step 은 실행이 보장되지 않는다
  #   (종전 6주 침묵의 원인). `needs` 결과는 matrix 전체의 집계(하나라도 failure/cancelled 면 그 값)다.
  mutation-notify:
    needs: mutation
    if: ${{ always() && (needs.mutation.result == 'failure' || needs.mutation.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
      contents: read
    steps:
      - name: 실패·취소 시 issue 통보 (실패 대상 목록 포함)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
        run: |
          TITLE="[llm-smoke] weekly mutation ${MUTATION_RESULT}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SUMMARY=$(gh run view "${{ github.run_id }}" --json jobs \
            --jq '.jobs[] | select(.name | startswith("mutation (")) | select(.conclusion == "failure" or .conclusion == "cancelled") | "- \(.name): \(.conclusion)"' 2>/dev/null)
          SUMMARY="${SUMMARY:-실패 job 목록 조회 불가 — run 페이지 확인}"
          BODY="주간 mutation score 게이트 ${MUTATION_RESULT} — run: ${RUN_URL}
          대상별 결과:
          \`\`\`
          ${SUMMARY}
          \`\`\`
          cancelled 는 timeout-minutes 초과일 수 있다 — matrix 의 timeout 을 실측 소요의 2배 이상으로 유지한다."
          EXISTING=$(gh issue list --state open --search "in:title $TITLE" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi

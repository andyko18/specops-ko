#     `vs::current "$fid"; printf '\n'` 에서 **후행 printf 가 함수 rc 를 가린다**(항상 0).
#     그리고 `vs::record` 에는 return 0 사이트가 없다. 따라서 아래 사이트의 rc 변형은

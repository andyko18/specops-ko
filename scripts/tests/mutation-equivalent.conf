# ── verification-state (20260912-verify-stale-docs-scope) ────────────────────
# 아래 return 0 변형이 등가인 **실제 근거** (Phase B 재검토가 초판 주석의 오기를 적발 — 정정본):
#   ★ "종료코드를 보는 곳이 없다" 는 **거짓이었다**. 실제로는 governance-lib.sh:1265 `|| return 1` ·
#     reconcile-check.sh:131 · release-ready.sh:107 · run-verification.sh:48 이 CLI rc 를 본다.
#   등가가 성립하는 진짜 이유는 CLI 진입점의 형태다 — verification-state.sh 의
#     `vs::current "$fid"; printf '\n'` 에서 **후행 printf 가 함수 rc 를 가린다**(항상 0).
#     그리고 `vs::record` 에는 return 0 사이트가 없다. 따라서 아래 사이트의 rc 변형은
#     어떤 소비자에게도 도달하지 않는다.
#   ⚠️ 그 줄을 `vs::current "$fid" && printf '\n'` 류로 바꾸면 rc 가 새어나가고,
#     이 등가 등재가 **실 변이 6건을 숨기게 된다**. CLI 진입점을 고칠 때 이 블록을 함께 재검토할 것.
# ★ 등재하지 않은 것: L133(nondoc/tree 비교 조건)·L167·L169(WAIVED 필드 검증)의 `&&` 변형은
#   등가가 아니라 **실제 미커버**다 — 등가로 덮으면 자기발급 면제표가 된다. 테스트로 잡을 대상이다.

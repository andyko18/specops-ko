# governance-lib 는 게이트 핵심 — 전체 governance 스위트로 측정 (20260714: 구 명령은 test-lib+test-rules 만 돌려
#   _verify_exec_evidence·_strip_heredoc_bodies 등을 미커버 → 32% false rot. 전체 스위트로 55%. baseline=55.
hooks/governance-lib.sh|bash scripts/tests/governance/test-lib.sh >/dev/null 2>&1 && bash scripts/tests/governance/test-rules.sh >/dev/null 2>&1 && bash scripts/tests/governance/test-exec-evidence.sh >/dev/null 2>&1 && bash scripts/tests/governance/test-pretool.sh >/dev/null 2>&1 && bash scripts/tests/governance/test-verify-progress.sh >/dev/null 2>&1 && bash scripts/tests/governance/test-hooks.sh >/dev/null 2>&1
# pretool-governance 는 **차단 판정 본체**다(R-1/R-2 deny). 커버 스위트를 좁게 잡으면
#   governance-lib 가 겪은 "32% false rot" 이 재발하므로 pretool 을 실제로 도는 스위트를 묶는다.
#   baseline=84 (20260829 실측: killed=11 survived=2 equivalent=12, 205s). 종전 36% 에서 분류·보강.
#   내역: 신규 테스트로 2건 격추(L219 fail-open 계약 · L397 hard deny 분기) ·
#         12건은 근거를 확인해 equivalent 등재(rc-무시 return 10 + 중복가드 L19 + 관찰동일 L364).
#   ★ 남은 생존 2건은 **정직하게 생존으로 둔다** — equivalent 아니고 진짜 미검이다:
#     L193 `&&` — R-1-SCOPE **info 기록**의 조건. 판정·차단에는 무관하고 friction-log 데이터만
#                 바뀐다. 계측 정합 테스트가 없어 안 죽는다(계측 신뢰도 backlog 와 같은 축).
#     L361 `&&` — batch fids 목록이 있는 상태에서 단일 detect_fid 로 **덮어쓰는** 변이.
#                 batch FID 목록 ≠ detect_fid 인 픽스처가 없어 안 죽는다.
#   근거 없는 equivalent 등재는 자기발급 면제표다 — 이 repo 가 §auto·bare SKIP 에서 두 번
#   없앤 패턴이라, 확인 못 한 것은 등재하지 않는다.
hooks/pretool-governance.sh|bash scripts/tests/governance/test-pretool.sh >/dev/null 2>&1 && bash scripts/tests/governance/test-rules.sh >/dev/null 2>&1 && bash scripts/tests/governance/test-hooks.sh >/dev/null 2>&1

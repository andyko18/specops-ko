hooks/governance-lib.sh|bash scripts/tests/governance/test-lib.sh >/dev/null 2>&1 && bash scripts/tests/governance/test-rules.sh >/dev/null 2>&1 && bash scripts/tests/governance/test-exec-evidence.sh >/dev/null 2>&1 && bash scripts/tests/governance/test-pretool.sh >/dev/null 2>&1 && bash scripts/tests/governance/test-verify-progress.sh >/dev/null 2>&1 && bash scripts/tests/governance/test-hooks.sh >/dev/null 2>&1
